name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          for f in fxmanifest.lua config.lua client.lua server.lua; do luac5.4 -p "$f"; done

      - name: Package
        run: |
          mkdir -p dist/dark_magic
          cp fxmanifest.lua config.lua client.lua server.lua README.md dist/dark_magic/
          (cd dist && zip -r ../dark_magic.zip dark_magic)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
          name: Dark Magic ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}
          generate_release_notes: true
          files: dark_magic.zip
