name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          for f in fxmanifest.lua config.lua client.lua server.lua; do luac5.4 -p "$f"; done

      - name: Package
        run: |
          mkdir -p dist/dark_magic
          cp fxmanifest.lua config.lua client.lua server.lua README.md dist/dark_magic/
          (cd dist && zip -r ../dark_magic.zip dark_magic)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Dark Magic ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dark_magic.zip
